            </ul>
        </nav>

    <main>
        <div>
        <h1>Consulta de Disponibilidad</h1>
        <form action="check_availability.php" method="post">
            <label for="consulta-nombre">Nombre:</label>
            <input type="text" id="consulta-nombre" name="consulta-nombre" required>
            
            <label for="consulta-email">Correo Electrónico:</label>
            <input type="email" id="consulta-email" name="consulta-email" required>
            
            <label for="consulta-fecha">Fecha de Reserva:</label>
            <input type="date" id="consulta-fecha" name="consulta-fecha" required>
            
            <label for="consulta-destino">Destino:</label>
            <select id="consulta-destino" name="consulta-destino" required>
                <option value="">Seleccione un destino</option>
                <option value="playa">Playa</option>
                <option value="montana">Montaña</option>
                <option value="ciudad">Ciudad</option>
            </select>
            
            <button type="submit" class="cta-button">Consultar Disponibilidad</button>
        </form>
    </div>
    <div>
        <h1>Formulario de Reserva</h1>
        <form action="submit_reservation.php" method="post">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" required>
            
            <label for="email">Correo Electrónico:</label>
            <input type="email" id="email" name="email" required>
            
            <label for="telefono">Teléfono:</label>
            <input type="tel" id="telefono" name="telefono" required>
            
            <label for="fecha">Fecha de Reserva:</label>
            <input type="date" id="fecha" name="fecha" required>
            
            <label for="destino">Destino:</label>
            <select id="destino" name="destino" required>
                <option value="">Seleccione un destino</option>
                <option value="playa">Playa</option>
                <option value="montana">Montaña</option>
                <option value="ciudad">Ciudad</option>
            </select>
            
            <label for="personas">Número de Personas:</label>
            <input type="number" id="personas" name="personas" min="1" required>
            
            <button type="submit" class="cta-button">Enviar Reserva</button>
        </form>
    </div>
    </main>
